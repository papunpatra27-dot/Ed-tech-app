name: Build Android APK & Play Store AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          fi

      - name: Install dependencies & build web app
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Add Capacitor Android & sync assets
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK (Direct Phone Install)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Release AAB (Google Play Store)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bangaprep-android-builds
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
